<!doctype html>
<!-- Source for og.png, the link-preview image. To regenerate: open this at
     1200x630 in a browser and screenshot it, then save over og.png. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600&f[]=general-sans@400,500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b0b0c; }
  .card {
    position: relative; width: 1200px; height: 630px; padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: flex-end;
    color: #ececee; font-family: "General Sans", system-ui, sans-serif;
    /* the same faint 32px grid as the site */
    background-image:
      linear-gradient(rgba(92,92,100,0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(92,92,100,0.16) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  svg { position: absolute; inset: 0; }
  .kicker { font-family: "JetBrains Mono", monospace; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: #8d8d96; margin-bottom: 22px; }
  .kicker i { font-style: normal; color: #5c5c64; margin: 0 0.4em; }
  h1 { font-family: "Clash Display", sans-serif; font-weight: 600; font-size: 168px; line-height: 0.9; letter-spacing: -0.04em; }
  .line { margin-top: 30px; font-size: 32px; color: #b9b9c0; max-width: 900px; line-height: 1.3; }
  .line b { color: #ff6a2b; font-weight: 500; }
  .status { position: absolute; top: 64px; right: 80px; font-size: 22px; color: #8d8d96; display: flex; align-items: center; gap: 12px; }
  .status span { width: 12px; height: 12px; border-radius: 50%; background: #4ade80; }
  .mark { position: absolute; top: 60px; left: 80px; font-family: "JetBrains Mono", monospace; font-size: 30px; font-weight: 600; }
  .mark b { color: #ff6a2b; }
</style>
</head>
<body>
<div class="card">
  <!-- Static "agents": orange trails along grid lines, fading toward their tails -->
  <svg viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
      <linearGradient id="t1" x1="0" x2="1"><stop offset="0" stop-color="#ff6a2b" stop-opacity="0"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0.7"/></linearGradient>
      <linearGradient id="t2" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#ff6a2b" stop-opacity="0"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0.7"/></linearGradient>
    </defs>
    <g fill="none" stroke-width="2">
      <path d="M640 128 H864 V224" stroke="url(#t1)"/>
      <path d="M960 352 V192 H1088" stroke="url(#t1)"/>
      <path d="M736 64 V160" stroke="url(#t2)"/>
      <path d="M1024 448 H1152 V384" stroke="url(#t1)"/>
    </g>
    <g fill="#ff6a2b">
      <rect x="860" y="220" width="8" height="8"/>
      <rect x="1084" y="188" width="8" height="8"/>
      <rect x="732" y="156" width="8" height="8"/>
      <rect x="1148" y="380" width="8" height="8"/>
    </g>
    <g font-family="JetBrains Mono, monospace" font-size="16" fill="#4ade80" opacity="0.75">
      <text x="880" y="214">parse docket</text>
      <text x="1000" y="176">write script</text>
    </g>
  </svg>
  <div class="mark">SJ<b>_</b></div>
  <div class="status"><span></span>Open to Spring 2027 co-op</div>
  <p class="kicker">Waterloo CS <i>/</i> Data pipelines <i>/</i> Full-stack apps</p>
  <h1>Sohan Javali</h1>
  <p class="line">I build things that make tasks easier, from an <b>LLM pipeline</b> that reads regulatory dockets to a <b>podcast generator</b>.</p>
</div>
</body>
</html>
